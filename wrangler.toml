name = "ncepuwiki-image-uploader"
main = "src/index.ts"
compatibility_date = "2026-09-08"

[vars]
IMAGE_BASE_URL = "https://img.ncepuinfo.cc"
REQUIRE_AUTH = "true"
# GitHub 组织：组织 owner 可批准别人的申请，组织成员的操作直接生效
GITHUB_ORG = "NCEPUwiki"
# 应急 owner 名单：只在 GitHub 角色校验不可用时兜底（如 GITHUB_TOKEN 未配置或接口故障），留空则完全依赖 GitHub 判定
ADMIN_EMAILS = "1361942776@qq.com,2668566027@qq.com"
# GITHUB_TOKEN 是密钥，不写在这里；用 `pnpm exec wrangler secret put GITHUB_TOKEN` 配置
# Cloudflare Access 登录团队域名与 Application Audience（用于校验 JWT 签名）
ACCESS_TEAM_DOMAIN = "https://ncepuwiki.cloudflareaccess.com"
ACCESS_AUD = "611b1c0247488b8e43511c4067980306c89afd3a8305769957e37f2fcbb9daaa"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "ncepuwiki-image"
preview_bucket_name = "ncepuwiki-image"
